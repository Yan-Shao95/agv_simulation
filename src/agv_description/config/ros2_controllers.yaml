    joints: [module_1_left_wheel_joint, module_1_right_wheel_joint, module_2_left_wheel_joint, module_2_right_wheel_joint, module_3_left_wheel_joint, module_3_right_wheel_joint, module_4_left_wheel_joint, module_4_right_wheel_joint]
